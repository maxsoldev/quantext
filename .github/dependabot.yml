# Dependency updates (SECURITY.md, ADR 28). The cooldown matches pnpm's minimumReleaseAge (1440 minutes), so
# Dependabot never proposes a version that pnpm install would refuse as too new.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 1
    versioning-strategy: increase # keep exact pins (saveExact)
    open-pull-requests-limit: 5
    ignore:
      # rolldown is pinned to the version Vite resolves (scripts/dependencies.test.ts); it moves with Vite.
      - dependency-name: rolldown
      # The Node types follow the lowest Node we support (engines: >= 22.18), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns: ["*"]
