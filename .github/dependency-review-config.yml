# actions/dependency-review-action on each PR (.github/workflows/supply-chain.yml). SECURITY.md explains it.
# allow-licenses must equal LICENCE_ALLOWLIST in scripts/lib/supply-chain.ts (a test checks this).
fail-on-severity: moderate
fail-on-scopes: [runtime, development, unknown]
allow-licenses:
  - MIT
  - MIT-0
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - BlueOak-1.0.0
  - CC0-1.0
  - Unlicense
  - Python-2.0
  - CC-BY-4.0
# Dev-only exceptions, each with its reason. Never a package the plugin bundles.
allow-dependencies-licenses:
  # lightningcss (MPL-2.0): Vite's CSS tool, used at build time only; its output is not MPL-covered code.
  - pkg:npm/lightningcss
  - pkg:npm/lightningcss-android-arm64
  - pkg:npm/lightningcss-darwin-arm64
  - pkg:npm/lightningcss-darwin-x64
  - pkg:npm/lightningcss-freebsd-x64
  - pkg:npm/lightningcss-linux-arm-gnueabihf
  - pkg:npm/lightningcss-linux-arm64-gnu
  - pkg:npm/lightningcss-linux-arm64-musl
  - pkg:npm/lightningcss-linux-x64-gnu
  - pkg:npm/lightningcss-linux-x64-musl
  - pkg:npm/lightningcss-win32-arm64-msvc
  - pkg:npm/lightningcss-win32-x64-msvc
comment-summary-in-pr: never
