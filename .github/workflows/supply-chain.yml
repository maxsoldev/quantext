name: Supply chain

# Vulnerabilities, registry signatures, licences, SBOM and dependency review (SECURITY.md, ADR 28).
# The lockfile, pnpm settings and licence checks also run in CI's pnpm check; the weekly run finds advisories
# published after a dependency was added.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit, signatures, licences, SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Fails on a package not in the lockfile, a changed integrity hash, or an install script (strictDepBuilds).
      - run: pnpm install --frozen-lockfile

      # The gate: what the plugin ships (production dependencies, bundled into the engine and the viewer).
      - name: Known vulnerabilities in shipped dependencies
        run: pnpm audit --prod --audit-level=moderate

      # Build tools do not ship; their advisories are shown, not failed on.
      - name: Known vulnerabilities in dev dependencies (report only)
        run: |
          if ! pnpm audit --dev --audit-level=low; then
            echo "::warning title=pnpm audit (dev)::dev dependencies have known vulnerabilities; see this step's log"
          fi

      - name: Registry signatures of every installed package
        run: pnpm audit signatures

      - name: Lockfile sources, pnpm settings, install scripts, licences
        run: pnpm supply-chain

      - name: SBOM (CycloneDX 1.7)
        run: |
          mkdir -p sbom
          pnpm sbom --sbom-format cyclonedx --sbom-type application --prod --out sbom/quantext-plugin.cdx.json
          pnpm sbom --sbom-format cyclonedx --sbom-type application --out sbom/quantext-build.cdx.json
          node -e 'for (const f of process.argv.slice(1)) JSON.parse(require("fs").readFileSync(f, "utf8"))' sbom/*.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  osv:
    name: OSV-Scanner (report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A second database (OSV: GitHub, npm and others) over the whole lockfile, dev tools included. It cannot
      # tell dev from production in a pnpm lockfile, so it reports; pnpm audit --prod is the gate.
      - id: scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

      - if: steps.scan.outcome == 'failure'
        run: echo "::warning title=OSV-Scanner::known vulnerabilities in pnpm-lock.yaml; see the scan step's log"

  dependency-review:
    name: Dependency review
    # Needs the dependency graph: public repos, or private ones with GitHub Code Security.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  release-sbom:
    name: Attach the SBOM to the release
    if: github.event_name == 'release'
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - run: gh release upload "$TAG" sbom/*.cdx.json --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
