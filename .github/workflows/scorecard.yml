name: Scorecard

# OpenSSF Scorecard (SECURITY.md, ADR 28). It reads a public repo's settings and history and publishes the
# score; on a private repo it cannot run, so the analysis job is skipped there.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # Mondays 05:41 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  visibility:
    name: Is the repo public
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      private: ${{ steps.repo.outputs.private }}
    steps:
      - id: repo
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  analysis:
    name: Scorecard analysis
    needs: visibility
    if: needs.visibility.outputs.private == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scorecard's publishing allows only these actions in this job, and these permissions.
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the published results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
